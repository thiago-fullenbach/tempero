# Complementa a configuração padrão do detekt (buildUponDefaultConfig = true).
naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'

complexity:
  LongParameterList:
    ignoreAnnotated: ['Composable']
    functionThreshold: 8
    constructorThreshold: 10
  LongMethod:
    ignoreAnnotated: ['Composable', 'Preview']
  TooManyFunctions:
    thresholdInFiles: 20
    thresholdInClasses: 20
    ignoreAnnotatedFunctions: ['Preview']
  CyclomaticComplexMethod:
    ignoreAnnotated: ['Composable']

style:
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreAnnotated: ['Preview', 'Composable']
    excludes:
      - '**/test/**'
      - '**/androidTest/**'
      - '**/core/designsystem/**'
      - '**/core/testing/**'
      - '**/testFixtures/**'
      - '**/preview/**'
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
  MaxLineLength:
    maxLineLength: 120

formatting:
  active: true
  MaximumLineLength:
    maxLineLength: 120
  FunctionNaming:
    active: false
  NoWildcardImports:
    active: false
  ImportOrdering:
    active: false
